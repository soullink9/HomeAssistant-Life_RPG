name: Bug report
description: Something in Life RPG isn't working as it should.
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant (Settings → About) and Life RPG (the version is on any adventurer's device page).
      placeholder: Home Assistant 2026.9.4, Life RPG 1.0.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them.
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Quests and sensors
        - The System panel or cards
        - Market and haggling
        - Paintings (ComfyUI)
        - The goddess, chats or other LLM writing
        - Assist (voice)
        - Setup and options
        - Something else
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → System → Logs, search for life_rpg. For painting problems, add your model type and image-edit model.
      render: text
